heat_template_version: 2021-04-16
description: "lab3 2026-03-10"
resources:
  tpb-group:
    type: "OS::Neutron::SecurityGroup"
    properties:
      rules:
        - ethertype: IPv4
          protocol: tcp
          remote_mode: remote_ip_prefix
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: "0.0.0.0/0"
      description: "My security group for app instance"
  tpb-server:
    type: "OS::Nova::Server"
    properties:
      # description: "Weather server with db"
      name: "cherdantsev-instance-lab03"
      flavor: "m1.small"
      image: "d608627a-ef62-452d-8a74-1c307cbe276d" # ubuntu 22.04
      availability_zone: nova
      key_name: "cherdantsev"
      networks:
      - port: { get_resource: server-01-port }
    depends_on:
      - tpb-group

  server-01-port:
    type: OS::Neutron::Port
    properties:
      network_id: "6a69f855-8a2d-4994-baf0-ed4feedd897b" # students.net ID
      security_groups:
        - default
        - { get_resource: tpb-group }
  